<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOTORTECH Mobile Prototype</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090b0f;color:#f2f4f7;font:14px Inter,Arial,sans-serif}
header{padding:14px 18px;background:#11151b;border-bottom:1px solid #29313d;position:sticky;top:0;z-index:3}
main{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:24px;padding:20px;max-width:1100px;margin:auto}
nav{display:grid;gap:7px;align-content:start}.screen-card{background:#151a21;color:#f2f4f7;border:1px solid #29313d;border-radius:10px;padding:10px;text-align:left;cursor:pointer}.screen-card.active{border-color:#f12d42}.screen-card small{display:block;color:#929aa6;margin-top:5px;line-height:1.35}
.stage{display:flex;justify-content:center;align-items:start}.phone{width:min(390px,100%);height:min(844px,calc(100vh - 110px));min-height:650px;background:#0b0d11;border:8px solid #252b34;border-radius:30px;overflow:hidden;box-shadow:0 15px 55px #0009;display:flex;flex-direction:column}
.phone iframe{width:100%;height:100%;border:0;background:#0b0d11}
.controls{display:flex;justify-content:space-between;align-items:center;padding:10px;background:#11151b;border-top:1px solid #29313d}.controls button{background:#f12d42;color:white;border:0;border-radius:8px;padding:9px 14px;cursor:pointer}.controls span{font-size:12px;color:#aab1bc}
@media(max-width:700px){main{grid-template-columns:1fr;padding:12px}.stage{grid-row:1}.phone{height:calc(100vh - 160px);min-height:560px}nav{grid-template-columns:1fr 1fr;max-height:220px;overflow:auto}}
</style></head><body><header><b>MOTORTECH</b> <span style="color:#929aa6">· Mobile-first clickable prototype · 18 layar</span> <a href="19_Admin_Desktop_Prototype.html" style="float:right;color:#ff6474;font-weight:700;text-decoration:none">Pratinjau admin desktop →</a></header>
<main><nav><button class="screen-card" onclick="show(0)"><b>01. Beranda Pelanggan</b><small>Pelanggan · Ringkasan servis motor dan akses cepat untuk booking.</small></button><button class="screen-card" onclick="show(1)"><b>02. Daftar Layanan</b><small>Pelanggan · Pilih layanan servis sesuai kebutuhan kendaraan.</small></button><button class="screen-card" onclick="show(2)"><b>03. Form Booking</b><small>Pelanggan · Masukkan data kendaraan dan keluhan sebelum booking.</small></button><button class="screen-card" onclick="show(3)"><b>04. Pilih Jadwal</b><small>Pelanggan · Pilih tanggal dan slot waktu kunjungan.</small></button><button class="screen-card" onclick="show(4)"><b>05. Konfirmasi Booking</b><small>Pelanggan · Periksa kembali detail sebelum konfirmasi.</small></button><button class="screen-card" onclick="show(5)"><b>06. Tiket Antrean</b><small>Pelanggan · Tiket digital dan nomor antrean pelanggan.</small></button><button class="screen-card" onclick="show(6)"><b>07. Cek Status Antrean</b><small>Pelanggan · Pantau status dan estimasi antrean.</small></button><button class="screen-card" onclick="show(7)"><b>08. Login Admin</b><small>Admin · Autentikasi petugas bengkel.</small></button><button class="screen-card" onclick="show(8)"><b>09. Dashboard Admin</b><small>Admin · Ringkasan operasional bengkel.</small></button><button class="screen-card" onclick="show(9)"><b>10. Manajemen Antrean</b><small>Admin · Kelola antrean yang sedang berjalan.</small></button><button class="screen-card" onclick="show(10)"><b>11. Manajemen Booking</b><small>Admin · Kelola booking pelanggan.</small></button><button class="screen-card" onclick="show(11)"><b>12. Data Pelanggan</b><small>Admin · Daftar dan detail data pelanggan.</small></button><button class="screen-card" onclick="show(12)"><b>13. Manajemen Layanan</b><small>Admin · Atur layanan, durasi, dan harga.</small></button><button class="screen-card" onclick="show(13)"><b>14. Riwayat Servis</b><small>Admin · Riwayat pekerjaan servis kendaraan.</small></button><button class="screen-card" onclick="show(14)"><b>15. Laporan Bengkel</b><small>Admin · Ringkasan pendapatan dan performa bengkel.</small></button><button class="screen-card" onclick="show(15)"><b>16. Antrean Langsung</b><small>Admin · Daftarkan pelanggan walk-in tanpa booking.</small></button><button class="screen-card" onclick="show(16)"><b>17. Transaksi</b><small>Admin · Catat pembayaran servis dan sparepart.</small></button><button class="screen-card" onclick="show(17)"><b>18. Pengaturan</b><small>Admin · Kelola profil, jam, notifikasi, dan preferensi.</small></button></nav><section class="stage"><div class="phone"><iframe id="screen" title="Pratinjau layar"></iframe><div class="controls"><button onclick="prev()">← Sebelumnya</button><span id="counter">01 / 18</span><button onclick="next()">Berikutnya →</button></div></div></section></main>
<script>
const files=["01_Beranda_Pelanggan.svg", "02_Daftar_Layanan.svg", "03_Form_Booking.svg", "04_Pilih_Jadwal.svg", "05_Konfirmasi_Booking.svg", "06_Tiket_Antrean.svg", "07_Cek_Status_Antrean.svg", "08_Login_Admin.svg", "09_Dashboard_Admin.svg", "10_Manajemen_Antrean.svg", "11_Manajemen_Booking.svg", "12_Data_Pelanggan.svg", "13_Manajemen_Layanan.svg", "14_Riwayat_Servis.svg", "15_Laporan_Bengkel.svg", "16_Antrean_Langsung.svg", "17_Transaksi.svg", "18_Pengaturan.svg"];
let current=0;
function show(i){current=Math.max(0,Math.min(files.length-1,i));document.getElementById('screen').src=files[current];document.getElementById('counter').textContent=String(current+1).padStart(2,'0')+' / 18';document.querySelectorAll('.screen-card').forEach((x,j)=>x.classList.toggle('active',j===current));}
function prev(){show(current-1)}function next(){show(current+1)}show(0);
</script></body></html>
