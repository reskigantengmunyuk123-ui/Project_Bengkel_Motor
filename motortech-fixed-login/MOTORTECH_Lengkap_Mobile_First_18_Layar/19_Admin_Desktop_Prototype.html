<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOTORTECH · Desktop Admin Prototype</title>
<style>
:root{color-scheme:dark;--bg:#0b0d11;--panel:#141820;--card:#181e27;--card2:#10151c;--line:#29313d;--text:#f4f6f8;--muted:#9ca6b4;--red:#f12d42;--green:#46c58b;--blue:#6daeff;--amber:#f0bc54}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,"Segoe UI",Arial,sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:264px minmax(0,1fr)}aside{height:100vh;position:sticky;top:0;padding:26px 18px;background:#11161d;border-right:1px solid var(--line);display:flex;flex-direction:column}.brand{display:block;margin:2px 9px 28px}.brand img{display:block;width:218px;height:60px;object-fit:cover;border-radius:5px;background:#fff}.nav-label{margin:12px 10px 7px;color:#697484;font-size:10px;letter-spacing:1.3px;font-weight:800;text-transform:uppercase}.nav{display:grid;gap:4px}.nav button{width:100%;display:flex;align-items:center;gap:12px;border:0;border-radius:9px;padding:12px 13px;background:transparent;color:#c4ccd6;text-align:left;font:inherit;font-size:14px;font-weight:600;cursor:pointer}.nav button:hover{background:#1c232d;color:#fff}.nav button.active{background:linear-gradient(110deg,#f12d42,#ad1727);color:#fff}.nav i{width:23px;text-align:center;font-style:normal;font-size:17px}.profile{margin-top:auto;border-top:1px solid var(--line);padding:18px 8px 0;display:flex;align-items:center;gap:11px}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#372128;color:#ff7180;font-weight:800}.profile b,.profile small{display:block}.profile small{font-size:12px;color:var(--muted)}.profile .out{margin-left:auto;color:#ff7180;font-size:13px}main{min-width:0;padding:30px clamp(28px,3.1vw,56px) 56px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px}.crumb{font-size:12px;color:var(--muted);margin-bottom:5px}.top h1{font-size:32px;letter-spacing:-.8px;line-height:1.15;margin:0 0 5px}.top p{color:var(--muted);margin:0}.top-right{display:flex;align-items:center;gap:12px}.date{padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--muted);font-size:13px}.primary{background:var(--red);border:1px solid var(--red);color:white;padding:11px 16px;border-radius:9px;font-weight:750;font-size:14px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px}.metric,.panel{background:var(--card);border:1px solid var(--line);border-radius:14px}.metric{padding:19px 21px}.metric label{font-size:13px;color:var(--muted);font-weight:650}.metric strong{display:block;font-size:34px;line-height:1.1;margin:11px 0 5px;letter-spacing:-1px}.metric small{font-size:12px;color:var(--muted)}.red{color:var(--red)}.green{color:var(--green)}.blue{color:var(--blue)}.amber{color:var(--amber)}.split{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(330px,1fr);gap:18px}.panel{padding:23px;min-width:0}.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:19px}.panel h2{font-size:18px;margin:0 0 4px}.panel p{font-size:13px;color:var(--muted);margin:0}.chart{height:280px;display:flex;align-items:end;gap:clamp(14px,2.6vw,38px);padding:18px 16px 0;border-bottom:1px solid var(--line)}.bar{flex:1;max-width:64px;min-width:24px;border-radius:8px 8px 0 0;background:linear-gradient(180deg,#fa4354,#a91626);position:relative}.bar b{position:absolute;top:-24px;left:50%;transform:translateX(-50%);color:var(--muted);font-size:12px}.days{display:flex;justify-content:space-around;color:var(--muted);font-size:12px;padding:10px 0}.activity{display:grid}.activity-item{display:grid;grid-template-columns:45px 1fr auto;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.activity-item:last-child{border-bottom:0}.queue-no{font-weight:800;color:var(--red)}.activity-item b{display:block;font-size:13px}.activity-item small{color:var(--muted);font-size:12px}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;background:#20372f;color:#68d5a1;font-size:11px;font-weight:750;white-space:nowrap}.pill.wait{background:#3a3020;color:var(--amber)}.pill.work{background:#1e2d42;color:var(--blue)}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}.filters{display:flex;gap:10px;flex:1}.input{min-height:44px;min-width:0;padding:10px 13px;border-radius:9px;background:var(--card2);border:1px solid var(--line);color:var(--text);font:inherit;font-size:14px}.filters .input:first-child{width:min(420px,45%)}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;white-space:nowrap}.table th{text-align:left;color:var(--muted);font-size:12px;letter-spacing:.35px;background:#202630;padding:14px 16px}.table td{padding:16px;border-bottom:1px solid var(--line);font-size:14px}.table tbody tr:hover{background:#1d242d}.strong{font-weight:750}.right{text-align:right}.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.detail{display:grid;grid-template-columns:155px 1fr;padding:13px 0;border-bottom:1px solid var(--line);gap:15px}.detail span{color:var(--muted)}.walkin{display:grid;grid-template-columns:minmax(360px,.9fr) minmax(0,1.4fr);gap:20px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:7px}.field label{font-size:12px;color:#cbd2dc;font-weight:700}.field.wide{grid-column:1/-1}.queue-ticket{min-height:190px;display:grid;place-items:center;text-align:center;background:linear-gradient(145deg,#202832,#151a22);border:1px solid #394453;border-radius:14px;margin-bottom:18px}.queue-ticket small{color:var(--muted);letter-spacing:1px}.queue-ticket strong{display:block;font-size:62px;line-height:1.1;color:var(--red);letter-spacing:-2px}.empty{padding:54px;text-align:center;color:var(--muted)}@media(max-width:1050px){.app{grid-template-columns:220px minmax(0,1fr)}aside{padding:20px 12px}main{padding:24px}.metrics{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.walkin{grid-template-columns:1fr}}@media(max-width:700px){.app{display:block}aside{position:static;height:auto;padding:14px}.brand{margin:0 4px 12px}.nav-label,.profile{display:none}.nav{display:flex;overflow:auto}.nav button{width:auto;flex:none;padding:10px}.nav button i{display:none}main{padding:20px 14px 32px}.top{align-items:flex-start}.top h1{font-size:26px}.top-right .date{display:none}.metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{padding:14px}.metric strong{font-size:27px}.toolbar{align-items:stretch;flex-direction:column}.filters{flex-direction:column}.filters .input:first-child{width:100%}.detail-grid,.fields{grid-template-columns:1fr}.field.wide{grid-column:auto}.panel{padding:16px}.chart{height:210px}.activity-item{grid-template-columns:38px 1fr}.activity-item .pill{grid-column:2;justify-self:start}.table td{padding:12px}.walkin{grid-template-columns:1fr}}
</style>
</head>
<body><div class="app"><aside><div class="brand"><img src="motortech-logo.png" alt="MOTORTECH Mechanical Engineering"></div><div class="nav-label">Workspace</div><nav class="nav" id="nav"></nav><div class="profile"><div class="avatar">MT</div><div><b>Admin MOTORTECH</b><small>Administrator</small></div><span class="out">↪ Keluar</span></div></aside><main><header class="top"><div><div class="crumb">Workspace / <span id="crumb">Dashboard</span></div><h1 id="title">Dashboard Admin</h1><p id="subtitle">Ringkasan aktivitas operasional bengkel.</p></div><div class="top-right"><span class="date">06 Nov 2026</span><button class="primary" id="action">Unduh Laporan</button></div></header><section id="content"></section></main></div>
<script>
const pages=[
 ['Dashboard','▦','Dashboard Admin','Ringkasan performa dan aktivitas bengkel.','dashboard'],
 ['Antrean','◷','Manajemen Antrean','Panggil pelanggan dan pantau servis yang sedang berjalan.','queue'],
 ['Booking','▤','Manajemen Booking','Kelola jadwal dan konfirmasi pelanggan.','bookings'],
 ['Pelanggan','♙','Data Pelanggan','Pelanggan, kendaraan, dan frekuensi kunjungan.','customers'],
 ['Layanan','⚙','Manajemen Layanan','Atur layanan servis, estimasi, dan harga.','services'],
 ['Stok Sparepart','▧','Stok Sparepart','Pantau stok dan harga komponen bengkel.','spareparts'],
 ['Riwayat Servis','◴','Riwayat Servis','Telusuri pekerjaan yang telah selesai atau dibatalkan.','history'],
 ['Laporan','▥','Laporan Bengkel','Pendapatan dan performa operasional berdasarkan periode.','reports'],
 ['Antrean Langsung','＋','Pendaftaran Antrean Langsung','Masukkan pelanggan walk-in ke antrean hari ini.','walkin'],
 ['Transaksi','↔','Riwayat Transaksi','Pantau transaksi servis yang telah selesai.','transactions'],
 ['Pengaturan','⚙','Pengaturan Workspace','Informasi akun dan operasional bengkel.','settings']
];
const sample=[['A-024','Rizky Pratama','Honda Vario 125','Ganti Oli','06 Nov 2026 · 09.00','Menunggu'],['A-023','Dewi Lestari','Yamaha NMAX','Servis Rutin','06 Nov 2026 · 08.00','Dikerjakan'],['A-022','Budi Santoso','Honda Beat','Tune Up','05 Nov 2026 · 14.00','Selesai'],['A-021','Nadia Putri','Suzuki Satria','Servis Rem','05 Nov 2026 · 11.00','Dibatalkan']];
const stat=(label,value,color,note)=>`<article class="metric"><label>${label}</label><strong class="${color}">${value}</strong><small>${note}</small></article>`;
const panel=(title,sub,body)=>`<section class="panel"><div class="panel-head"><div><h2>${title}</h2><p>${sub}</p></div></div>${body}</section>`;
const chart=()=>`<div class="chart">${[44,66,52,82,61,92,72].map((v,i)=>`<div class="bar" style="height:${v}%"><b>${[8,12,9,16,11,19,14][i]}</b></div>`).join('')}</div><div class="days"><span>Min</span><span>Sen</span><span>Sel</span><span>Rab</span><span>Kam</span><span>Jum</span><span>Sab</span></div>`;
const activity=()=>`<div class="activity">${sample.map((r,i)=>`<div class="activity-item"><span class="queue-no">${r[0]}</span><div><b>${r[1]} · ${r[3]}</b><small>${r[4]}</small></div><span class="pill ${i===0?'wait':i===1?'work':''}">${r[5]}</span></div>`).join('')}</div>`;
const table=(headers,rows)=>`<div class="table-wrap"><table class="table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map((v,i)=>`<td class="${i===0?'strong':''}">${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const rowsFor=(type)=>{
 if(type==='customers')return [['Rizky Pratama','0812-3456-7890','Honda Vario 125','8 kali'],['Dewi Lestari','0813-2233-4455','Yamaha NMAX','5 kali'],['Budi Santoso','0812-8888-1122','Honda Beat','3 kali']];
 if(type==='services')return [['Servis Rutin','Pemeriksaan berkala dan penyetelan','Rp 50.000','60 menit','Aktif'],['Ganti Oli','Penggantian oli mesin','Rp 30.000','20 menit','Aktif'],['Tune Up','Pemeriksaan performa mesin','Rp 75.000','90 menit','Aktif']];
 if(type==='spareparts')return [['Oli Mesin 1L','OLI-001','18','Rp 65.000','Tersedia'],['Kampas Rem Depan','REM-024','4','Rp 85.000','Menipis'],['Busi Motor','BUS-013','0','Rp 25.000','Habis']];
 if(type==='transactions')return [['06 Nov 2026','MT-261106-018','Rizky Pratama','Ganti Oli','Rp 30.000','Lunas'],['05 Nov 2026','MT-261105-017','Budi Santoso','Tune Up','Rp 75.000','Lunas'],['04 Nov 2026','MT-261104-014','Dewi Lestari','Servis Rutin','Rp 50.000','Lunas']];
 if(type==='history')return [['06 Nov 2026','A-022','Budi Santoso','Tune Up','Selesai'],['05 Nov 2026','A-019','Nadia Putri','Servis Rem','Dibatalkan'],['04 Nov 2026','A-014','Dewi Lestari','Servis Rutin','Selesai']];
 return sample.map(r=>type==='bookings'?[r[0],r[1],r[4],r[3],`<span class="pill ${r[5]==='Menunggu'?'wait':r[5]==='Dikerjakan'?'work':''}">${r[5]}</span>`]:[r[0],r[1],r[3],r[4],`<span class="pill ${r[5]==='Menunggu'?'wait':r[5]==='Dikerjakan'?'work':''}">${r[5]}</span>`,type==='queue'?'Panggil':'Detail']);
};
function render(index){const p=pages[index],type=p[4];document.getElementById('crumb').textContent=p[0];document.getElementById('title').textContent=p[2];document.getElementById('subtitle').textContent=p[3];document.querySelectorAll('.nav button').forEach((b,i)=>b.classList.toggle('active',i===index));document.getElementById('action').textContent=({services:'Tambah Layanan',spareparts:'Tambah Sparepart',bookings:'Tambah Booking',walkin:'Daftarkan Antrean',reports:'Ekspor PDF',transactions:'Unduh Rekap'})[type]||'Unduh Laporan';let html='';
 if(type==='dashboard'){html=`<div class="metrics">${stat('Booking Hari Ini','18','red','+4 dari kemarin')}${stat('Antrean Aktif','7','blue','3 sedang dikerjakan')}${stat('Servis Selesai','24','green','Hari ini')}${stat('Menunggu Konfirmasi','5','amber','Perlu ditinjau')}</div><div class="split">${panel('Aktivitas 7 Hari','Volume booking dan servis',chart())}${panel('Aktivitas Terbaru','Pembaruan workspace',activity())}</div>`}
 else if(type==='walkin'){html=`<div class="walkin"><section class="panel"><div class="panel-head"><div><h2>Data pelanggan walk-in</h2><p>Nomor antrean langsung untuk kunjungan hari ini.</p></div></div><div class="fields">${['Nama pelanggan','WhatsApp','Jenis motor','Nomor polisi','Pilih layanan'].map((x,i)=>`<div class="field ${i>2?'wide':''}"><label>${x}</label><input class="input" placeholder="${x}"></div>`).join('')}<div class="field wide"><label>Keluhan</label><input class="input" placeholder="Catatan untuk mekanik"></div></div><p style="margin-top:18px"><button class="primary">Ambil Nomor Antrean</button></p></section><section class="panel"><div class="panel-head"><div><h2>Antrean Hari Ini</h2><p>Perkiraan giliran pelanggan bengkel.</p></div><span class="pill wait">7 aktif</span></div><div class="queue-ticket"><div><small>NOMOR SEDANG DILAYANI</small><strong>A-023</strong><span>Dewi Lestari · Servis Rutin</span></div></div>${activity()}</section></div>`}
 else if(type==='settings'){html=`<div class="detail-grid">${panel('Informasi Akun','Akun yang sedang mengakses workspace.',`<div class="detail"><span>Nama</span><b>Admin MOTORTECH</b></div><div class="detail"><span>Username</span><b>mechanic</b></div><div class="detail"><span>Peran</span><b>Administrator</b></div><div class="detail"><span>Status</span><b class="green">Aktif</b></div>`)}${panel('Informasi Bengkel','Data operasional yang tampil di website.',`<div class="detail"><span>Nama Bengkel</span><b>MOTORTECH</b></div><div class="detail"><span>Jam Operasional</span><b>Setiap hari · 08.00–21.00</b></div><div class="detail"><span>Alamat</span><b>Jl. Pemuda No. 123, Banyumas</b></div><div class="detail"><span>Layanan</span><b>Servis motor dan suku cadang</b></div>`)}</div>`}
 else if(type==='reports'){html=`<div class="metrics">${stat('Total Servis','128','red','Periode ini')}${stat('Pendapatan','Rp 8,4 jt','green','+12% dari periode lalu')}${stat('Rata-rata Durasi','54 mnt','blue','Waktu pengerjaan')}</div><div class="split">${panel('Tren Servis','Jumlah booking per hari',chart())}${panel('Layanan Terpopuler','Proporsi dari seluruh servis',activity())}</div>`}
 else {let headers=type==='customers'?['Pelanggan','WhatsApp','Kendaraan','Kunjungan']:type==='services'?['Nama Layanan','Deskripsi','Harga','Durasi','Status']:type==='spareparts'?['Nama Sparepart','SKU','Stok','Harga','Status']:type==='transactions'?['Tanggal','Kode Booking','Pelanggan','Layanan','Nominal','Status']:type==='history'?['Tanggal','Antrean','Pelanggan','Layanan','Status']:type==='bookings'?['Kode Booking','Pelanggan','Jadwal','Layanan','Status']:['No. Antrean','Pelanggan','Layanan','Jadwal','Status','Aksi'];let rows=rowsFor(type);html=`<div class="toolbar"><div class="filters"><input class="input" placeholder="Cari ${type==='customers'?'pelanggan':type==='history'?'booking atau nama':'data'}..."><input class="input" type="date"></div>${type==='queue'?'<span class="pill wait">7 antrean aktif</span>':''}</div>${panel(type==='queue'?'Antrean berjalan':p[2],type==='queue'?'Urutan pelanggan dan progres pengerjaan':'Daftar operasional bengkel',table(headers,rows))}`}
 document.getElementById('content').innerHTML=html}
document.getElementById('nav').innerHTML=pages.map((p,i)=>`<button onclick="render(${i})"><i>${p[1]}</i>${p[0]}</button>`).join('');render(0);
</script></body></html>
